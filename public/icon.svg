<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="50%" stop-color="#6b21a8" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    
    <!-- Gold Coin Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Piggy Pink Gradient -->
    <linearGradient id="pigGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Cap Gradient -->
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- App Icon Base Shape -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle inner shine border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="4" />

  <!-- Glow behind piggy bank -->
  <circle cx="256" cy="270" r="160" fill="#ffffff" fill-opacity="0.1" />

  <!-- Gold Coin Slot dropping in -->
  <g filter="url(#dropShadow)">
    <circle cx="256" cy="140" r="42" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="4" />
    <circle cx="256" cy="140" r="32" fill="none" stroke="#a16207" stroke-width="3" stroke-dasharray="4,2" />
    <text x="256" y="152" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="30" fill="#713f12" text-anchor="middle">Rp</text>
  </g>

  <!-- Piggy Bank Body -->
  <g filter="url(#dropShadow)">
    <!-- Main Piggy Body -->
    <ellipse cx="256" cy="290" rx="125" ry="95" fill="url(#pigGrad)" />
    
    <!-- Ears -->
    <path d="M 170 215 Q 150 160 195 180 Z" fill="#f472b6" stroke="#db2777" stroke-width="3" />
    <path d="M 342 215 Q 362 160 317 180 Z" fill="#f472b6" stroke="#db2777" stroke-width="3" />

    <!-- Snout -->
    <ellipse cx="256" cy="305" rx="38" ry="26" fill="#f472b6" stroke="#db2777" stroke-width="3" />
    <circle cx="242" cy="305" r="6" fill="#9d174d" />
    <circle cx="270" cy="305" r="6" fill="#9d174d" />

    <!-- Cute Eyes -->
    <circle cx="210" cy="265" r="10" fill="#1e1b4b" />
    <circle cx="213" cy="262" r="3" fill="#ffffff" />
    <circle cx="302" cy="265" r="10" fill="#1e1b4b" />
    <circle cx="305" cy="262" r="3" fill="#ffffff" />

    <!-- Cheeks -->
    <circle cx="185" cy="285" r="12" fill="#f43f5e" opacity="0.3" />
    <circle cx="327" cy="285" r="12" fill="#f43f5e" opacity="0.3" />

    <!-- Feet -->
    <rect x="180" y="365" width="32" height="30" rx="10" fill="#f472b6" stroke="#db2777" stroke-width="3" />
    <rect x="300" y="365" width="32" height="30" rx="10" fill="#f472b6" stroke="#db2777" stroke-width="3" />
  </g>

  <!-- Graduation Toga Cap on Piggy -->
  <g filter="url(#dropShadow)">
    <polygon points="256,170 330,195 256,220 182,195" fill="url(#capGrad)" stroke="#818cf8" stroke-width="2" />
    <rect x="236" y="210" width="40" height="18" rx="4" fill="#1e1b4b" />
    <!-- Tassel -->
    <path d="M 310 200 C 310 230, 325 235, 325 245" fill="none" stroke="#fef08a" stroke-width="4" stroke-linecap="round" />
    <circle cx="325" cy="248" r="5" fill="#fef08a" />
  </g>

  <!-- Banner "KAS KELAS 1C" -->
  <g filter="url(#dropShadow)">
    <rect x="126" y="415" width="260" height="48" rx="24" fill="#10b981" stroke="#a7f3d0" stroke-width="3" />
    <text x="256" y="447" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="21" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">KAS KELAS 1C</text>
  </g>
</svg>
